name: agrigpt_assistant
description: "A complete Flutter Chat App for AgriGPT AI Agriculture Assistant."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # AI Integrations
  google_generative_ai: ^0.2.0

  # Rich UI & Formatting
  flutter_markdown: ^0.6.18
  lucide_icons: ^0.320.0
  google_fonts: ^6.1.0
  uuid: ^4.3.3
  intl: ^0.19.0

  # Media & Hardware
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  camera: ^0.10.5+9

  # Voice & Speech
  speech_to_text: ^6.3.0
  flutter_tts: ^3.8.5

  # Utilities & Sharing
  share_plus: ^7.2.1
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
